{% extends "base.html" %}
{% set active_nav = "coach" %}

{% block topbar_right %}
<div style="display:flex; align-items:center; gap:8px;">
  <div style="width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite;"></div>
  <div style="font-size:12px; color:var(--text-mid);">AI保育士</div>
</div>
{% endblock %}

{% block content %}
<style>
.coach-intro { padding:16px 0 8px; }
.coach-avatar {
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--purple));
  display:flex; align-items:center; justify-content:center;
  font-size:32px; margin-bottom:12px;
  box-shadow:0 4px 16px rgba(91,142,240,0.3);
}
.chat-area {
  flex:1; overflow-y:auto; padding:8px 0;
  display:flex; flex-direction:column; gap:12px;
  min-height:300px; max-height:50vh;
}
.msg-wrap { display:flex; align-items:flex-end; gap:8px; }
.msg-wrap.user { flex-direction:row-reverse; }
.msg-avatar {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; background:var(--primary-light);
}
.msg-bubble {
  max-width:80%; padding:12px 14px; border-radius:16px;
  font-size:14px; line-height:1.6; white-space:pre-wrap;
}
.msg-bubble.coach {
  background:var(--surface); color:var(--text);
  border-bottom-left-radius:4px;
  box-shadow:var(--shadow);
}
.msg-bubble.user {
  background:var(--primary); color:white;
  border-bottom-right-radius:4px;
}
.msg-time {
  font-size:10px; color:var(--text-light);
  margin-top:4px; text-align:center;
}

.quick-questions {
  display:flex; gap:6px; overflow-x:auto;
  padding:4px 0; margin:8px 0;
}
.quick-q {
  flex-shrink:0; padding:8px 14px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:20px; font-size:12px; font-weight:600;
  color:var(--text-mid); cursor:pointer;
  transition:all 0.15s; white-space:nowrap;
}
.quick-q:active { background:var(--primary-light); border-color:var(--primary); color:var(--primary); }

.input-row {
  display:flex; gap:8px; align-items:center;
  background:var(--surface); border-radius:24px;
  padding:8px 8px 8px 16px; box-shadow:var(--shadow);
  margin-top:8px;
}
.input-row input {
  flex:1; border:none; outline:none; font-size:14px;
  background:transparent; color:var(--text);
}
.send-btn {
  width:40px; height:40px; border-radius:50%;
  background:var(--primary); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; transition:transform 0.1s;
  flex-shrink:0;
}
.send-btn:active { transform:scale(0.92); }

.typing-indicator { display:flex; gap:4px; padding:12px 14px; }
.typing-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--text-light);
  animation:pulse 1s ease infinite;
}
.typing-dot:nth-child(2) { animation-delay:0.2s; }
.typing-dot:nth-child(3) { animation-delay:0.4s; }
</style>

<!-- Coach header -->
<div class="coach-intro fade-up">
  <div class="coach-avatar">🌸</div>
  <div style="font-size:18px; font-weight:800; margin-bottom:4px;">AI保育コーチ</div>
  <div style="font-size:13px; color:var(--text-light);">{{ child_name }}ちゃん（{{ age_str }}）の担当</div>
</div>

<!-- Chat area -->
<div class="card fade-up-2" style="padding:16px;">
  <div class="chat-area" id="chatArea">
    <!-- Coach initial message -->
    <div class="msg-wrap">
      <div class="msg-avatar">🌸</div>
      <div class="msg-bubble coach">{{ initial_msg }}</div>
    </div>
  </div>

  <!-- Quick questions -->
  <div class="quick-questions" id="quickQuestions">
    <div class="quick-q" onclick="sendQuick('成長について教えて')">📈 成長について</div>
    <div class="quick-q" onclick="sendQuick('おすすめの遊びは？')">🎮 おすすめ遊び</div>
    <div class="quick-q" onclick="sendQuick('育児が不安です')">😟 不安がある</div>
    <div class="quick-q" onclick="sendQuick('言葉の発達が心配')">💬 言葉の発達</div>
    <div class="quick-q" onclick="sendQuick('最近疲れています')">😪 疲れています</div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <input type="text" id="msgInput" placeholder="保育コーチに相談する…" maxlength="200"
           onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');

function addMessage(text, role) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap' + (role === 'user' ? ' user' : '');
  wrap.innerHTML = role === 'coach'
    ? `<div class="msg-avatar">🌸</div><div class="msg-bubble coach">${text}</div>`
    : `<div class="msg-bubble user">${text}</div>`;
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg-wrap'; el.id = 'typing';
  el.innerHTML = `<div class="msg-avatar">🌸</div><div class="msg-bubble coach"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  document.getElementById('quickQuestions').style.display = 'none';
  addMessage(text, 'user');
  showTyping();
  await new Promise(r => setTimeout(r, 800 + Math.random()*600));
  const res = await fetch('/coach/message', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message: text})
  });
  removeTyping();
  const data = await res.json();
  if (data.ok) addMessage(data.reply, 'coach');
}

function sendQuick(text) {
  msgInput.value = text;
  sendMessage();
}
</script>
