{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align:center;">
  <div style="font-size: 28px;">👦</div>
  <div style="font-size: 20px; font-weight:bold; margin: 8px 0;">{{ child_name }}</div>
  <div style="color: #888;">{{ age_str }}</div>
</div>

<h2 style="margin: 16px 0 8px; font-size: 18px;">🎮 どんなあそびにする？</h2>

<form action="/suggest" method="post">
  <button type="submit" name="style" value="まったり" class="btn card" style="background:white; border: 3px solid #ff8c42; font-size:20px; padding:20px;">
    😌 まったり
    <div style="font-size:13px; color:#888; font-weight:normal; margin-top:4px;">のんびりゆったり</div>
  </button>
  <button type="submit" name="style" value="アクティブ" class="btn card" style="background:white; border: 3px solid #4caf50; font-size:20px; padding:20px;">
    🏃 アクティブ
    <div style="font-size:13px; color:#888; font-weight:normal; margin-top:4px;">からだをうごかそう</div>
  </button>
  <button type="submit" name="style" value="大冒険" class="btn card" style="background:white; border: 3px solid #2196f3; font-size:20px; padding:20px;">
    🗺️ 大冒険
    <div style="font-size:13px; color:#888; font-weight:normal; margin-top:4px;">わくわくどきどき</div>
  </button>
</form>

<a href="/" class="btn btn-secondary">← もどる</a>
{% endblock %}
